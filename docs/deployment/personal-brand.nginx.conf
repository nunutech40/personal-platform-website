# Template: /etc/nginx/sites-available/personal-brand
# Replace YOUR_DOMAIN before enabling.
# Current planned domain: nunugraha.web.id
# This assumes Cloudflare SSL mode Full and the existing self-signed cert pattern on the VPS.

server {
    listen 80;
    listen 443 ssl;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    client_max_body_size 25m;

    # Persistent local uploads, outside the app checkout/release.
    location /uploads/ {
        alias /home/nunuadmin/personal-brand-shared/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phoenix LiveView websocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    server_tokens off;
}
